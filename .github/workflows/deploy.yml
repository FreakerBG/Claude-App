name: Deploy to GitHub Pages

# Builds the PWA and publishes it to GitHub Pages so it can be installed
# on your iPhone (Safari → Add to Home Screen) and PC (browser → Install).
#
# ONE-TIME SETUP (only needed the very first time):
#   On GitHub → repo Settings → Pages → "Build and deployment" →
#   Source: "GitHub Actions". After that this workflow deploys on every push.
on:
  push:
    branches:
      - main
      - claude/self-improvement-tracker-app-w8f8yx
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          # Project pages are served from /<repo>/ — the repo is "Claude-App",
          # so assets must resolve at https://freakerbg.github.io/Claude-App/
          BASE_PATH: /Claude-App/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
